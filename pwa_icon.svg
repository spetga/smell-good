  <!-- Monogram G -->
  <text x="256" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-weight="400" fill="#fff" opacity="0.9">G</text>
  <!-- Shimmer dots -->
  <circle cx="330" cy="235" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="345" cy="255" r="3" fill="#fff" opacity="0.35"/>
  <circle cx="320" cy="258" r="3.5" fill="#fff" opacity="0.3"/>
