<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#F7F6F2"/>
  <!-- Bottle body -->
  <rect x="186" y="220" width="140" height="200" rx="24" fill="#3A8FA8"/>
  <!-- Bottle neck -->
  <rect x="216" y="160" width="80" height="68" rx="12" fill="#3A8FA8"/>
